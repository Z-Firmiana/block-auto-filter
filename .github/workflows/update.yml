name: Auto Update Filter
run-name: Update uBlock filter list
on:
  schedule:
    # UTC 每 12h 执行；换成 0 */6 * * * 就是每6小时
    - cron: '0 */12 * * *'
  # 支持手动点按钮立即运行测试
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run convert script
        run: python convert.py

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add filter.txt
          # 没有改动就跳过提交
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto update filter $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
